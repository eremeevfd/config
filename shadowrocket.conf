# ===== Shadowrocket Config (RU + VLESS REALITY) =====

[General]
bypass-system = true
skip-proxy = 127.0.0.1, localhost, *.local
dns-server = 1.1.1.1, 8.8.8.8
ipv6 = false
loglevel = notify
update-url = https://raw.githubusercontent.com/eremeevfd/config/main/shadowrocket.conf


[Proxy]
VLESS-Reality = vless://YXV0bzo5YTFlMDRmOC1mYTJlLTQ4ZGEtOWUwMC1lMmEwNGY5NTQ5NTNAMTAzLjIyOC4xNjguMTA2OjQ0Mw?remarks=vless-reality&tls=1&peer=www.microsoft.com&xtls=2&pbk=uRZxEBbt85T21U7P-TGdlChe7HZA_3PcQsyrAkD-BTA&sid=4d83be814ab93656


[Proxy Group]
PROXY = select, VLESS-Reality
AUTO = url-test, VLESS-Reality, url=https://cp.cloudflare.com/generate_204, interval=600


[Rule]

