# ===== Shadowrocket Config (RU optimized) =====

[General]
bypass-system = true
skip-proxy = 127.0.0.1, localhost, *.local
dns-server = 1.1.1.1, 8.8.8.8
ipv6 = false
loglevel = notify

# OPTIONAL: set this after uploading to GitHub
update-url = https://raw.githubusercontent.com/eremeevfd/config/main/shadowrocket.conf


[Proxy]
# --- REPLACE WITH YOUR SERVER ---
Proxy = vmess, YOUR_SERVER_IP, 443, username=UUID, tls=true


[Proxy Group]
PROXY = select, Proxy
AUTO = url-test, Proxy, interval=600, timeout=5, url=https://cp.cloudflare.com/generate_204


[Rule]

# --- LOCAL NETWORK ---
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT

# --- RUSSIA DOMAINS ---
DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,xn--p1ai,DIRECT

# --- YANDEX ---
DOMAIN-KEYWORD,yandex,DIRECT
DOMAIN-SUFFIX,yandex.ru,DIRECT
DOMAIN-SUFFIX,yandex.com,DIRECT
DOMAIN-SUFFIX,yandex.net,DIRECT
DOMAIN-SUFFIX,ya.ru,DIRECT
DOMAIN-SUFFIX,yastatic.net,DIRECT

# --- VK / MAIL ---
DOMAIN-SUFFIX,vk.com,DIRECT
DOMAIN-SUFFIX,userapi.com,DIRECT
DOMAIN-SUFFIX,mail.ru,DIRECT

# --- BANKS / GOV ---
DOMAIN-SUFFIX,gosuslugi.ru,DIRECT
DOMAIN-SUFFIX,sberbank.ru,DIRECT
DOMAIN-SUFFIX,vtb.ru,DIRECT

# --- GEOIP fallback ---
GEOIP,RU,DIRECT

# --- TELEGRAM (optional via proxy) ---
DOMAIN-SUFFIX,t.me,PROXY
DOMAIN-SUFFIX,telegram.org,PROXY

# --- ADS BLOCK ---
DOMAIN-KEYWORD,doubleclick,REJECT
DOMAIN-KEYWORD,ads,REJECT

# --- DEFAULT ---
FINAL,PROXY
